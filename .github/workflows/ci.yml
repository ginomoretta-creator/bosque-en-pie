name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 20 (con caché de npm)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Python 3.12 (con caché de pip)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: oracle/requirements.txt

      - name: Dependencias de Node
        run: npm ci

      - name: Compilar el contrato
        run: npx hardhat compile

      - name: Pruebas del contrato
        run: npx hardhat test

      - name: Dependencias de Python
        run: pip install -r oracle/requirements.txt

      - name: Pruebas del oráculo
        run: pytest oracle/tests
